name: "DevSecOps CI/CD Pipeline — AWS Academy"

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  AWS_REGION:       us-east-1
  # ✅ Docker Hub au lieu d'ECR (ECR bloqué par voc-cancel-cred sur AWS Academy)
  DOCKERHUB_IMAGE:  ${{ secrets.REPO_USER }}/devsecops-project
  ECS_CLUSTER:      devsecops-cluster
  ECS_SERVICE:      devsecops-service
  ECS_TASK_FAMILY:  devsecops-task
  CONTAINER_NAME:   devsecops-app
  LOG_GROUP:        /ecs/devsecops
  SNS_TOPIC_ARN:    arn:aws:sns:us-east-1:792782834628:soc-alerts

# ============================================================
# JOB 1 — SAST + Tests unitaires
# ============================================================
jobs:
  sast-scan:
    name: "Secrets & Static Analysis"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks — detect secrets in git history
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --source . --verbose --redact --exit-code=0 --no-git

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r app/requirements.txt
          pip install bandit safety pytest pytest-cov

      - name: Bandit — static code analysis
        run: |
          bandit -r app/ -f json -o bandit-report.json -ll --exclude app/tests || true
          echo "✅ Bandit scan complete"

      - name: Safety — check CVEs in dependencies
        run: |
          safety check -r app/requirements.txt --json > safety-report.json || true
          echo "✅ Safety scan complete"

      - name: Run unit tests
        run: |
          cd app
          pytest tests/ -v \
            --junitxml=test-results.xml \
            --cov=. \
            --cov-report=xml:coverage.xml \
            --cov-report=term-missing
          echo "✅ All tests passed"

      - name: Upload SAST reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sast-reports
          path: |
            bandit-report.json
            safety-report.json
            app/test-results.xml
            app/coverage.xml
          retention-days: 14

# ============================================================
# JOB 2 — Build Docker Hub + Trivy scan
# ✅ FIX 1: Docker Hub au lieu d'ECR (voc-cancel-cred)
# ✅ FIX 2: Trivy scanne l'image locale avant push
# ✅ FIX 3: CodeQL v4 (v3 déprécié)
# ============================================================
  build-scan:
    name: "Build & Container Security — Docker Hub"
    runs-on: ubuntu-latest
    needs: sast-scan
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.REPO_USER }}
          password: ${{ secrets.PWD }}

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ env.DOCKERHUB_IMAGE }}:${{ github.sha }} \
            -t ${{ env.DOCKERHUB_IMAGE }}:latest \
            ./app
          echo "✅ Image built: ${{ env.DOCKERHUB_IMAGE }}:${{ github.sha }}"

      - name: Trivy — scan image locale (CRITICAL + HIGH)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref:      "${{ env.DOCKERHUB_IMAGE }}:${{ github.sha }}"
          scan-type:      "image"
          format:         "sarif"
          output:         "trivy-results.sarif"
          severity:       "CRITICAL,HIGH"
          exit-code:      "0"
          ignore-unfixed: true

      - name: Upload Trivy SARIF — GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-results.sarif

      - name: Push image to Docker Hub
        if: github.event_name == 'push'
        run: |
          docker push ${{ env.DOCKERHUB_IMAGE }}:${{ github.sha }}
          docker push ${{ env.DOCKERHUB_IMAGE }}:latest
          echo "✅ Image pushed: ${{ env.DOCKERHUB_IMAGE }}:${{ github.sha }}"

# ============================================================
# JOB 3 — DAST : OWASP ZAP (depuis Docker Hub)
# ============================================================
  dast-scan:
    name: "DAST — OWASP ZAP"
    runs-on: ubuntu-latest
    needs: build-scan

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.REPO_USER }}
          password: ${{ secrets.PWD }}

      - name: Start app container (depuis Docker Hub)
        run: |
          docker run -d \
            --name test-app \
            -p 5000:5000 \
            -e SECRET_KEY="test-secret-zap" \
            -e PORT="5000" \
            ${{ env.DOCKERHUB_IMAGE }}:${{ github.sha }}

      - name: Wait for /health endpoint
        run: |
          for i in {1..30}; do
            if curl -sf http://localhost:5000/health; then
              echo "✅ App ready at attempt $i"
              break
            fi
            echo "  Attempt $i/30 — retrying in 3s..."
            sleep 3
          done

      - name: OWASP ZAP baseline scan
        run: |
          CONTAINER_IP=$(docker inspect -f '{{range.NetworkSettings.Networks}}{{.IPAddress}}{{end}}' test-app)
          mkdir -p zap-reports && chmod 777 zap-reports
          docker run --rm \
            -v $(pwd)/zap-reports:/zap/wrk/:rw \
            --user root \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
            -t http://$CONTAINER_IP:5000 \
            -J report_json.json \
            -w report_md.md \
            -r report_html.html \
            -I || true
          cp zap-reports/report_html.html . 2>/dev/null || true
          cp zap-reports/report_json.json . 2>/dev/null || true
          echo "✅ ZAP scan completed"

      - name: Upload ZAP report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-report
          path: |
            report_html.html
            report_json.json
            report_md.md
          retention-days: 14

      - name: Stop test container
        if: always()
        run: docker stop test-app || true && docker rm test-app || true

# ============================================================
# JOB 4 — Publish & Notify
# ⛔ ECS bloqué par voc-cancel-cred (UpdateService, ListTasks, StopTask...)
# ✅ WORKAROUND : image publiée sur Docker Hub + CloudWatch + SNS
#    Le redéploiement ECS doit être fait MANUELLEMENT depuis la console AWS
# ============================================================
  deploy-aws:
    name: "Publish & Notify — Docker Hub + CloudWatch"
    runs-on: ubuntu-latest
    needs: dast-scan
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    outputs:
      deploy_time: ${{ steps.info.outputs.deploy_time }}
      image:       ${{ steps.info.outputs.image }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token:     ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region:            ${{ env.AWS_REGION }}

      # ── Vérifier que l'image a bien été poussée sur Docker Hub ──────
      - name: Vérifier image Docker Hub
        id: info
        run: |
          IMAGE="${{ env.DOCKERHUB_IMAGE }}:${{ github.sha }}"
          DEPLOY_TIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          echo "deploy_time=$DEPLOY_TIME" >> $GITHUB_OUTPUT
          echo "image=$IMAGE"             >> $GITHUB_OUTPUT

          echo "🐳 Image prête sur Docker Hub : $IMAGE"
          echo ""
          echo "⚠️  NOTE : ecs:UpdateService / ecs:ListTasks / ecs:StopTask"
          echo "    sont bloqués par voc-cancel-cred (AWS Academy)."
          echo "    → Redéploiement ECS à faire MANUELLEMENT :"
          echo "    Console AWS > ECS > devsecops-cluster > devsecops-service"
          echo "    > Update Service > Force new deployment ✓"

      # ── Injecter un log de déploiement dans CloudWatch ──────────────
      - name: Injecter événement de déploiement dans CloudWatch Logs
        run: |
          DEPLOY_TIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          NOW_MS=$(date -u +%s%3N)
          IMAGE="${{ env.DOCKERHUB_IMAGE }}:${{ github.sha }}"
          STREAM="ci-cd/deploys/${{ github.sha }}"
          MSG="[CI-CD] DEPLOY commit=${{ github.sha }} | image=$IMAGE | branch=${{ github.ref_name }} | actor=${{ github.actor }} | time=$DEPLOY_TIME"

          # Créer le log stream (ignore si existe déjà)
          aws logs create-log-stream \
            --log-group-name "${{ env.LOG_GROUP }}" \
            --log-stream-name "$STREAM" \
            --region ${{ env.AWS_REGION }} 2>/dev/null || true

          # Écrire l'événement
          aws logs put-log-events \
            --log-group-name  "${{ env.LOG_GROUP }}" \
            --log-stream-name "$STREAM" \
            --log-events "timestamp=${NOW_MS},message=${MSG}" \
            --region ${{ env.AWS_REGION }} && echo "✅ Log injecté dans CloudWatch" \
            || echo "⚠️  put-log-events non autorisé (non critique)"

      # ── Remettre les métriques SOC à 0 ──────────────────────────────
      - name: Remettre métriques SOC à 0
        run: |
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          aws cloudwatch put-metric-data \
            --namespace "SOC/Security" \
            --metric-data "MetricName=ErrorCount,Dimensions=[{Name=LogGroup,Value=${{ env.LOG_GROUP }}}],Value=0,Unit=Count,Timestamp=$TIMESTAMP" \
            --region ${{ env.AWS_REGION }} && echo "✅ ErrorCount remis à 0" \
            || echo "⚠️  put-metric-data non autorisé"
          aws cloudwatch put-metric-data \
            --namespace "SOC/Security" \
            --metric-data "MetricName=UnauthorizedAccessCount,Dimensions=[{Name=LogGroup,Value=${{ env.LOG_GROUP }}}],Value=0,Unit=Count,Timestamp=$TIMESTAMP" \
            --region ${{ env.AWS_REGION }} && echo "✅ UnauthorizedAccessCount remis à 0" \
            || echo "⚠️  put-metric-data non autorisé"

      # ── Envoyer notification SNS ────────────────────────────────────
      - name: Notification SNS — image prête
        run: |
          DEPLOY_TIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          IMAGE="${{ env.DOCKERHUB_IMAGE }}:${{ github.sha }}"
          aws sns publish \
            --topic-arn "${{ env.SNS_TOPIC_ARN }}" \
            --subject "✅ Image prête — ${{ github.repository }} (${{ github.ref_name }})" \
            --message "IMAGE CI/CD PRETE SUR DOCKER HUB

  Projet  : ${{ github.repository }}
  Branche : ${{ github.ref_name }}
  Commit  : ${{ github.sha }}
  Auteur  : ${{ github.actor }}
  Heure   : ${DEPLOY_TIME}
  Image   : ${IMAGE}

  ACTION REQUISE (ECS bloque par voc-cancel-cred) :
    Console AWS > ECS > devsecops-cluster
    > devsecops-service > Update Service
    > Force new deployment > cocher

  SOC Dashboard : /ecs/devsecops (CloudWatch)" \
            --region ${{ env.AWS_REGION }} && echo "✅ SNS envoyé" \
            || echo "⚠️  SNS non autorisé"

      # ── Résumé ──────────────────────────────────────────────────────
      - name: Résumé pipeline
        run: |
          IMAGE="${{ env.DOCKERHUB_IMAGE }}:${{ github.sha }}"
          echo "╔══════════════════════════════════════════════════╗"
          echo "║          PIPELINE CI/CD — TERMINÉ ✅             ║"
          echo "╠══════════════════════════════════════════════════╣"
          echo "║ Commit  : ${{ github.sha }}"
          echo "║ Image   : $IMAGE"
          echo "║ Acteur  : ${{ github.actor }}"
          echo "╠══════════════════════════════════════════════════╣"
          echo "║ ✅ SAST (Bandit + Safety + Tests)                ║"
          echo "║ ✅ Build + Trivy scan                            ║"
          echo "║ ✅ DAST (OWASP ZAP)                              ║"
          echo "║ ✅ Image poussée sur Docker Hub                  ║"
          echo "║ ✅ Log CI/CD → CloudWatch                        ║"
          echo "║ ✅ Métriques SOC → 0                             ║"
          echo "║ ✅ Notification SNS envoyée                      ║"
          echo "╠══════════════════════════════════════════════════╣"
          echo "║ ⚠️  ECS deploy bloqué (voc-cancel-cred)          ║"
          echo "║    → Faire manuellement depuis la console AWS    ║"
          echo "╚══════════════════════════════════════════════════╝"