name: "DevSecOps CI/CD Pipeline"

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  IMAGE_NAME: wassimoz/devsecops-project

jobs:
  sast-scan:
    name: "Secrets & Static Analysis"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks — detect secrets in git history
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --source . --verbose --redact --exit-code=0 --no-git  

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install security tools
        run: pip install bandit safety pytest

      - name: Bandit — static code analysis
        run: |
          bandit -r app/ \
            -f json \
            -o bandit-report.json \
            -ll \
            --exclude app/tests
          echo "Bandit scan complete"

      - name: Safety CLI — check known CVEs in dependencies
        run: |
          safety check -r app/requirements.txt --json > safety-report.json || true
          echo "Safety scan complete"

      - name: Install dependencies
        run: |
          pip install -r app/requirements.txt
          pip install pytest pytest-cov

      - name: Run unit tests
        run: |
          cd app
          pytest tests/ -v --junitxml=test-results.xml
          echo "Tests completed"

      - name: Upload SAST reports as artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sast-reports
          path: |
            bandit-report.json
            safety-report.json
            app/test-results.xml
          retention-days: 14

  build-scan:
    name: "Build & Container Security"
    runs-on: ubuntu-latest
    needs: sast-scan
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.REPO_USER }}
          password: ${{ secrets.PWD }}

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ env.IMAGE_NAME }}:${{ github.sha }} \
            -t ${{ env.IMAGE_NAME }}:latest \
            ./app

      - name: Trivy — scan container for vulnerabilities
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "${{ env.IMAGE_NAME }}:${{ github.sha }}"
          scan-type: "image"
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "CRITICAL,HIGH"
          exit-code: "0"
          ignore-unfixed: true

      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif

      - name: Push image to Docker Hub
        if: github.event_name == 'push'
        run: |
          docker push ${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker push ${{ env.IMAGE_NAME }}:latest

  dast-scan:
    name: "DAST — OWASP ZAP"
    runs-on: ubuntu-latest
    needs: build-scan

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.REPO_USER }}
          password: ${{ secrets.PWD }}

      - name: Start application container
        run: |
          docker run -d \
            --name test-app \
            -p 5000:5000 \
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Wait for app to be healthy
        run: |
          echo "Waiting for app to start..."
          for i in {1..30}; do
            if curl -sf http://localhost:5000/health; then
              echo "App is ready"
              break
            fi
            echo "Attempt $i failed, retrying in 3s..."
            sleep 3
          done

      - name: Get container IP and run ZAP
        run: |
          CONTAINER_IP=$(docker inspect -f '{{range.NetworkSettings.Networks}}{{.IPAddress}}{{end}}' test-app)
          echo "Container IP: $CONTAINER_IP"
          mkdir -p zap-reports
          
          docker run --rm \
            -v $(pwd)/zap-reports:/zap/wrk/:rw \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
            -t http://$CONTAINER_IP:5000 \
            -J report_json.json \
            -w report_md.md \
            -r report_html.html \
            -I || true
          
          if [ -f zap-reports/report_html.html ]; then
            cp zap-reports/report_html.html .
            cp zap-reports/report_json.json .
            cp zap-reports/report_md.md .
          fi

      - name: Upload ZAP report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-report
          path: |
            report_html.html
            report_json.json
            report_md.md
          retention-days: 14

      - name: Stop and remove test container
        if: always()
        run: docker stop test-app && docker rm test-app

  deploy-k8s:
    name: "Deploy — Kubernetes Production"
    runs-on: ubuntu-latest
    needs: dast-scan
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install KIND
        run: |
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/v0.20.0/kind-linux-amd64
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind
          kind version

      - name: Install kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.REPO_USER }}
          password: ${{ secrets.PWD }}

      - name: Pull Docker image
        run: |
          docker pull ${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker tag ${{ env.IMAGE_NAME }}:${{ github.sha }} ${{ env.IMAGE_NAME }}:prod

      - name: Create KIND cluster
        run: |
          cat <<EOF | kind create cluster --name=devsecops-prod --config=-
          kind: Cluster
          apiVersion: kind.x-k8s.io/v1alpha4
          name: devsecops-prod
          nodes:
          - role: control-plane
          - role: worker
          - role: worker
          networking:
            podSubnet: "10.244.0.0/16"
            serviceSubnet: "10.96.0.0/12"
          EOF

      - name: Load Docker image into KIND
        run: |
          kind load docker-image ${{ env.IMAGE_NAME }}:${{ github.sha }} --name devsecops-prod
          kind load docker-image ${{ env.IMAGE_NAME }}:prod --name devsecops-prod

      - name: Deploy to Kubernetes
        run: |
          kubectl create namespace devsecops --dry-run=client -o yaml | kubectl apply -f -
          kubectl apply -f k8s/secret.yml
          kubectl apply -f k8s/deployment.yml
          kubectl apply -f k8s/service.yml
          kubectl apply -f k8s/hpa.yml || echo "HPA skipped"

      - name: Wait for deployment
        run: |
          echo "Waiting for pods to be ready..."
          kubectl wait --for=condition=ready --timeout=180s pods -n devsecops -l app=devsecops-app || true
          sleep 10
          kubectl get pods -n devsecops -o wide

      - name: Verify deployment
        run: |
          echo "=== Pods Status ==="
          kubectl get pods -n devsecops
          echo "=== Services ==="
          kubectl get svc -n devsecops
          echo "=== HPA Status ==="
          kubectl get hpa -n devsecops || echo "HPA not configured"

      - name: Application Health Check
        run: |
          echo "=== Testing Application ==="
          kubectl port-forward -n devsecops service/devsecops-app-service 5000:80 &
          PF_PID=$!
          sleep 15
          
          HEALTH_RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:5000/health)
          if [ "$HEALTH_RESPONSE" = "200" ]; then
            echo "✅ Health check passed (HTTP $HEALTH_RESPONSE)"
          else
            echo "❌ Health check failed (HTTP $HEALTH_RESPONSE)"
          fi
          
          API_RESPONSE=$(curl -s http://localhost:5000/api/status)
          if echo "$API_RESPONSE" | grep -q "healthy"; then
            echo "✅ API status check passed"
          else
            echo "❌ API status check failed"
          fi
          
          kill $PF_PID 2>/dev/null || true

      - name: Deploy SOC Stack
        run: |
          echo "=== Deploying SOC Stack ==="
          kubectl create namespace soc --dry-run=client -o yaml | kubectl apply -f -
          kubectl apply -f k8s/soc/prometheus-config.yaml || echo "Prometheus config not found"
          kubectl apply -f k8s/soc/prometheus-deployment.yaml || echo "Prometheus deployment not found"
          kubectl apply -f k8s/soc/grafana-dashboard.yaml || echo "Grafana dashboard not found"
          kubectl apply -f k8s/soc/grafana-deployment.yaml || echo "Grafana deployment not found"
          echo "✅ SOC Stack deployed"

      - name: Verify SOC deployment
        run: |
          echo "=== SOC Pods ==="
          kubectl get pods -n soc
          echo "=== SOC Services ==="
          kubectl get svc -n soc

      - name: Collect deployment info
        if: always()
        run: |
          mkdir -p k8s-info
          POD_NAME=$(kubectl get pods -n devsecops -o jsonpath='{.items[0].metadata.name}')
          if [ -n "$POD_NAME" ]; then
            kubectl logs -n devsecops $POD_NAME --tail=50 > k8s-info/logs.txt
          else
            echo "No pods found" > k8s-info/logs.txt
          fi
          kubectl get all -n devsecops -o wide > k8s-info/all-resources.txt
          echo "✅ Deployment information collected"

      - name: Upload deployment info
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: k8s-deployment-info
          path: k8s-info/
          retention-days: 7

      - name: Final status
        run: |
          echo "========================================="
          echo "✅ DEPLOYMENT COMPLETED SUCCESSFULLY"
          echo "========================================="
          echo "Application: http://localhost:30080"
          echo "Grafana: http://localhost:3000 (admin/admin)"
          echo "Prometheus: http://localhost:9090"
          echo "========================================="
          echo ""
          echo "To access SOC dashboards locally:"
          echo "kubectl port-forward -n soc svc/grafana-service 3000:3000"
          echo "kubectl port-forward -n soc svc/prometheus-service 9090:9090"