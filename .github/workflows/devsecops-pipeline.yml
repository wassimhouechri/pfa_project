name: "DevSecOps CI/CD Pipeline — AWS Academy"

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  AWS_REGION:      us-east-1
  DOCKERHUB_IMAGE: ${{ secrets.REPO_USER }}/devsecops-project
  ECS_CLUSTER:     devsecops-cluster
  ECS_SERVICE:     devsecops-service
  ECS_TASK_FAMILY: devsecops-task
  CONTAINER_NAME:  devsecops-app
  LOG_GROUP:       /ecs/devsecops
  SNS_TOPIC_ARN:   arn:aws:sns:us-east-1:792782834628:soc-alerts

# ============================================================
# JOB 1 — SAST : Gitleaks + Bandit + Safety + Tests
# ============================================================
jobs:
  sast-scan:
    name: "SAST — Secrets + Static Analysis + Tests"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks — detect secrets in git history
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --source . --verbose --redact --exit-code=0 --no-git

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r app/requirements.txt
          pip install bandit safety pytest pytest-cov

      - name: Bandit — static code analysis
        run: |
          bandit -r app/ -f json -o bandit-report.json -ll --exclude app/tests || true
          echo "✅ Bandit scan complete"

      - name: Safety — check CVEs in dependencies
        run: |
          safety check -r app/requirements.txt --json > safety-report.json || true
          echo "✅ Safety scan complete"

      - name: Pytest — unit tests + coverage
        run: |
          cd app
          pytest tests/ -v \
            --junitxml=test-results.xml \
            --cov=. \
            --cov-report=xml:coverage.xml \
            --cov-report=term-missing
          echo "✅ All tests passed"

      - name: Upload SAST reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sast-reports
          path: |
            bandit-report.json
            safety-report.json
            app/test-results.xml
            app/coverage.xml
          retention-days: 14

# ============================================================
# JOB 2 — Build Docker Hub + Trivy scan image
# ✅ Docker Hub (ECR bloqué par voc-cancel-cred AWS Academy)
# ✅ Trivy scanne l'image locale AVANT push
# ✅ CodeQL v4
# ============================================================
  build-scan:
    name: "Build — Docker Hub + Trivy"
    runs-on: ubuntu-latest
    needs: sast-scan
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.REPO_USER }}
          password: ${{ secrets.PWD }}

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ env.DOCKERHUB_IMAGE }}:${{ github.sha }} \
            -t ${{ env.DOCKERHUB_IMAGE }}:latest \
            ./app
          echo "✅ Image built: ${{ env.DOCKERHUB_IMAGE }}:${{ github.sha }}"

      - name: Trivy — scan image locale (CRITICAL + HIGH)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref:      "${{ env.DOCKERHUB_IMAGE }}:${{ github.sha }}"
          scan-type:      "image"
          format:         "sarif"
          output:         "trivy-results.sarif"
          severity:       "CRITICAL,HIGH"
          exit-code:      "0"
          ignore-unfixed: true

      - name: Upload Trivy SARIF → GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-results.sarif

      - name: Push image to Docker Hub
        if: github.event_name == 'push'
        run: |
          docker push ${{ env.DOCKERHUB_IMAGE }}:${{ github.sha }}
          docker push ${{ env.DOCKERHUB_IMAGE }}:latest
          echo "✅ Pushed: ${{ env.DOCKERHUB_IMAGE }}:${{ github.sha }}"

# ============================================================
# JOB 3 — DAST : OWASP ZAP baseline scan
# ============================================================
  dast-scan:
    name: "DAST — OWASP ZAP"
    runs-on: ubuntu-latest
    needs: build-scan

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.REPO_USER }}
          password: ${{ secrets.PWD }}

      - name: Start app container
        run: |
          docker run -d \
            --name test-app \
            -p 5000:5000 \
            -e SECRET_KEY="test-secret-zap" \
            -e PORT="5000" \
            ${{ env.DOCKERHUB_IMAGE }}:${{ github.sha }}

      - name: Wait for /health endpoint
        run: |
          for i in {1..30}; do
            if curl -sf http://localhost:5000/health; then
              echo "✅ App ready at attempt $i"
              break
            fi
            echo "  Attempt $i/30 — retrying in 3s..."
            sleep 3
          done

      - name: OWASP ZAP baseline scan
        run: |
          CONTAINER_IP=$(docker inspect \
            -f '{{range.NetworkSettings.Networks}}{{.IPAddress}}{{end}}' test-app)
          echo "Container IP: $CONTAINER_IP"
          mkdir -p zap-reports && chmod 777 zap-reports
          docker run --rm \
            -v $(pwd)/zap-reports:/zap/wrk/:rw \
            --user root \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
            -t http://$CONTAINER_IP:5000 \
            -J report_json.json \
            -w report_md.md \
            -r report_html.html \
            -I || true
          cp zap-reports/report_html.html . 2>/dev/null || true
          cp zap-reports/report_json.json . 2>/dev/null || true
          echo "✅ ZAP scan completed"

      - name: Upload ZAP report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-report
          path: |
            report_html.html
            report_json.json
            report_md.md
          retention-days: 14

      - name: Stop test container
        if: always()
        run: docker stop test-app || true && docker rm test-app || true

# ============================================================
# JOB 4 — Deploy ECS Fargate
#
# STRATÉGIE voc-cancel-cred AWS Academy :
#   ❌ BLOQUÉ  : ecr:GetAuthorizationToken
#   ❌ BLOQUÉ  : ecs:DescribeTaskDefinition
#   ❌ BLOQUÉ  : ecs:UpdateService
#   ✅ AUTORISÉ: ecs:RegisterTaskDefinition
#   ✅ AUTORISÉ: ecs:ListTasks
#   ✅ AUTORISÉ: ecs:DescribeTasks
#   ✅ AUTORISÉ: ecs:StopTask  ← force ECS à redémarrer avec la nouvelle image
#   ✅ AUTORISÉ: ec2:DescribeNetworkInterfaces
#   ✅ AUTORISÉ: logs:* / cloudwatch:* / sns:*
#
# FLOW :
#   1. sed remplace DOCKERHUB_IMAGE_PLACEHOLDER dans ecs-task-definition.json
#   2. RegisterTaskDefinition → nouvelle revision
#   3. StopTask → ECS détecte crash → relance automatiquement
#      le service ECS avec la dernière task definition enregistrée
#   4. On récupère IP publique et on fait health check
# ============================================================
  deploy-ecs:
    name: "Deploy — ECS Fargate"
    runs-on: ubuntu-latest
    needs: dast-scan
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    outputs:
      task_id:     ${{ steps.get-task.outputs.task_id }}
      public_ip:   ${{ steps.get-task.outputs.public_ip }}
      deploy_time: ${{ steps.get-task.outputs.deploy_time }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token:     ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region:            ${{ env.AWS_REGION }}

      # ── ÉTAPE 1 : injecter image dans la task def locale ────────────
      # ecs-task-definition.json est dans le repo et contient
      # DOCKERHUB_IMAGE_PLACEHOLDER comme valeur d'image.
      # On NE fait PAS describe-task-definition (bloqué).
      - name: "Préparer task definition (image Docker Hub)"
        run: |
          NEW_IMAGE="${{ env.DOCKERHUB_IMAGE }}:${{ github.sha }}"
          echo "🐳 Nouvelle image : $NEW_IMAGE"

          # Vérifier que le fichier JSON est valide
          python3 -c "import json; json.load(open('ecs-task-definition.json'))" \
            && echo "✅ ecs-task-definition.json est valide" \
            || (echo "❌ ecs-task-definition.json est corrompu !" && exit 1)

          # Injecter l'image
          sed "s|DOCKERHUB_IMAGE_PLACEHOLDER|$NEW_IMAGE|g" \
            ecs-task-definition.json > task-def-ready.json

          echo "✅ task-def-ready.json :"
          cat task-def-ready.json

      # ── ÉTAPE 2 : register (autorisé) ───────────────────────────────
      - name: "Register nouvelle task definition"
        id: register
        run: |
          NEW_ARN=$(aws ecs register-task-definition \
            --cli-input-json file://task-def-ready.json \
            --query "taskDefinition.taskDefinitionArn" \
            --output text \
            --region ${{ env.AWS_REGION }})

          echo "✅ Registered : $NEW_ARN"
          echo "task_def_arn=$NEW_ARN" >> $GITHUB_OUTPUT

      # ── ÉTAPE 3 : forcer le redéploiement via StopTask ─────────────
      # UpdateService est bloqué → on stoppe la task en cours.
      # ECS (configured avec desired count ≥ 1) relance immédiatement
      # une nouvelle task en utilisant la dernière task definition
      # enregistrée pour ce service.
      - name: "Force redeploy via StopTask → ECS restart"
        run: |
          echo "🔍 Recherche de la task en cours..."

          TASK_ARN=$(aws ecs list-tasks \
            --cluster ${{ env.ECS_CLUSTER }} \
            --service-name ${{ env.ECS_SERVICE }} \
            --desired-status RUNNING \
            --query "taskArns[0]" \
            --output text \
            --region ${{ env.AWS_REGION }} 2>/dev/null || echo "None")

          if [ "$TASK_ARN" = "None" ] || [ -z "$TASK_ARN" ]; then
            echo "⚠️  Aucune task RUNNING trouvée — ECS démarrera la nouvelle task def automatiquement"
          else
            echo "🛑 Stop task : $TASK_ARN"
            aws ecs stop-task \
              --cluster ${{ env.ECS_CLUSTER }} \
              --task "$TASK_ARN" \
              --reason "CI/CD redeploy — commit ${{ github.sha }}" \
              --region ${{ env.AWS_REGION }} \
              && echo "✅ Task stoppée — ECS relance avec la nouvelle image" \
              || echo "⚠️  stop-task non autorisé"

            echo "⏳ Attente 45s pour que ECS relance la nouvelle task..."
            sleep 45
          fi

      # ── ÉTAPE 4 : récupérer IP publique + health check ──────────────
      - name: "Récupérer IP publique + health check"
        id: get-task
        run: |
          DEPLOY_TIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          TASK_ID=""
          PUBLIC_IP="N/A"

          echo "🔍 Recherche de la nouvelle task..."
          for i in {1..12}; do
            TASK_ARN=$(aws ecs list-tasks \
              --cluster ${{ env.ECS_CLUSTER }} \
              --service-name ${{ env.ECS_SERVICE }} \
              --desired-status RUNNING \
              --query "taskArns[0]" \
              --output text \
              --region ${{ env.AWS_REGION }} 2>/dev/null || echo "None")

            if [ "$TASK_ARN" != "None" ] && [ -n "$TASK_ARN" ]; then
              echo "✅ Task trouvée : $TASK_ARN"
              TASK_ID=$(echo "$TASK_ARN" | awk -F/ '{print $NF}')

              ENI_ID=$(aws ecs describe-tasks \
                --cluster ${{ env.ECS_CLUSTER }} \
                --tasks "$TASK_ARN" \
                --query "tasks[0].attachments[0].details[?name=='networkInterfaceId'].value" \
                --output text \
                --region ${{ env.AWS_REGION }} 2>/dev/null || echo "")

              if [ -n "$ENI_ID" ] && [ "$ENI_ID" != "None" ]; then
                PUBLIC_IP=$(aws ec2 describe-network-interfaces \
                  --network-interface-ids "$ENI_ID" \
                  --query "NetworkInterfaces[0].Association.PublicIp" \
                  --output text \
                  --region ${{ env.AWS_REGION }} 2>/dev/null || echo "N/A")
              fi
              break
            fi
            echo "  Attempt $i/12 — task pas encore RUNNING, attente 10s..."
            sleep 10
          done

          echo "task_id=$TASK_ID"         >> $GITHUB_OUTPUT
          echo "public_ip=$PUBLIC_IP"     >> $GITHUB_OUTPUT
          echo "deploy_time=$DEPLOY_TIME" >> $GITHUB_OUTPUT

          # Health check
          if [ "$PUBLIC_IP" != "N/A" ] && [ -n "$PUBLIC_IP" ]; then
            echo "⏳ Attente 20s pour le démarrage de Flask..."
            sleep 20
            HTTP=$(curl -s -o /dev/null -w "%{http_code}" \
              http://$PUBLIC_IP:5000/health 2>/dev/null || echo "000")
            echo ""
            echo "╔═══════════════════════════════════════════╗"
            echo "║        DEPLOYMENT COMPLETED ✅            ║"
            echo "╠═══════════════════════════════════════════╣"
            echo "║  App    : http://$PUBLIC_IP:5000"
            echo "║  SOC    : http://$PUBLIC_IP:5000/soc"
            echo "║  Health : HTTP $HTTP"
            echo "║  Image  : ${{ env.DOCKERHUB_IMAGE }}:${{ github.sha }}"
            echo "║  Task   : $TASK_ID"
            echo "╚═══════════════════════════════════════════╝"
          else
            echo "⚠️  IP non récupérée — vérifier manuellement dans la console ECS"
          fi

      # ── ÉTAPE 5 : afficher les derniers logs CloudWatch ─────────────
      - name: "Tail CloudWatch logs"
        if: always()
        run: |
          TASK_ID="${{ steps.get-task.outputs.task_id }}"
          if [ -n "$TASK_ID" ]; then
            echo "=== CloudWatch Logs — /ecs/devsecops ==="
            aws logs get-log-events \
              --log-group-name "${{ env.LOG_GROUP }}" \
              --log-stream-name "ecs/${{ env.CONTAINER_NAME }}/$TASK_ID" \
              --limit 30 \
              --region ${{ env.AWS_REGION }} \
              --query "events[*].message" \
              --output text 2>/dev/null \
              || echo "(logs pas encore disponibles — le container démarre)"
          else
            echo "⚠️  Pas de task_id — logs non disponibles"
          fi

# ============================================================
# JOB 5 — SOC Reset
# Réinitialise le dashboard SOC à chaque déploiement :
#   - Métriques ErrorCount + UnauthorizedAccessCount → 0
#   - Marqueur de déploiement injecté dans CloudWatch Logs
#   - Alarmes CloudWatch remises à OK si elles étaient en ALARM
#   - Notification email via SNS
# ============================================================
  soc-reset:
    name: "SOC Reset — Dashboard réinitialisé"
    runs-on: ubuntu-latest
    needs: deploy-ecs
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token:     ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region:            ${{ env.AWS_REGION }}

      # ── Métriques SOC → 0 ────────────────────────────────────────────
      - name: "Reset métriques SOC/Security → 0"
        run: |
          TS=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          for METRIC in ErrorCount UnauthorizedAccessCount; do
            aws cloudwatch put-metric-data \
              --namespace "SOC/Security" \
              --metric-data "MetricName=${METRIC},Dimensions=[{Name=LogGroup,Value=${{ env.LOG_GROUP }}}],Value=0,Unit=Count,Timestamp=${TS}" \
              --region ${{ env.AWS_REGION }} \
              && echo "✅ ${METRIC} → 0" \
              || echo "⚠️  ${METRIC} : put-metric-data non autorisé"
          done

      # ── Marqueur de déploiement dans CloudWatch Logs ─────────────────
      - name: "Injecter marqueur SOC-RESET dans CloudWatch Logs"
        run: |
          TASK_ID="${{ needs.deploy-ecs.outputs.task_id }}"
          NOW_MS=$(date -u +%s%3N)

          if [ -n "$TASK_ID" ]; then
            STREAM="ecs/${{ env.CONTAINER_NAME }}/${TASK_ID}"
          else
            STREAM="ci-cd/soc-reset/${{ github.sha }}"
          fi

          MSG="[SOC-RESET] Deploy OK | commit=${{ github.sha }} | branch=${{ github.ref_name }} | actor=${{ github.actor }} | metrics=0 | time=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"

          # Créer le stream si nécessaire
          aws logs create-log-stream \
            --log-group-name "${{ env.LOG_GROUP }}" \
            --log-stream-name "$STREAM" \
            --region ${{ env.AWS_REGION }} 2>/dev/null || true

          # Injecter le marqueur
          aws logs put-log-events \
            --log-group-name "${{ env.LOG_GROUP }}" \
            --log-stream-name "$STREAM" \
            --log-events "timestamp=${NOW_MS},message=${MSG}" \
            --region ${{ env.AWS_REGION }} \
            && echo "✅ Marqueur SOC-RESET injecté → CloudWatch Logs visible dans le SOC Dashboard" \
            || echo "⚠️  put-log-events non autorisé"

      # ── Alarmes CloudWatch → OK ───────────────────────────────────────
      - name: "Reset alarmes CloudWatch ALARM → OK"
        run: |
          for ALARM in \
            "SOC-ECS-Errors" \
            "SOC-Unauthorized-Access" \
            "SOC-ECS-Task-Stopped"; do

            STATE=$(aws cloudwatch describe-alarms \
              --alarm-names "$ALARM" \
              --query "MetricAlarms[0].StateValue" \
              --output text \
              --region ${{ env.AWS_REGION }} 2>/dev/null || echo "NOT_FOUND")

            echo "  $ALARM → état actuel : $STATE"

            if [ "$STATE" = "ALARM" ]; then
              aws cloudwatch set-alarm-state \
                --alarm-name "$ALARM" \
                --state-value OK \
                --state-reason "Auto-reset CI/CD commit ${{ github.sha }}" \
                --region ${{ env.AWS_REGION }} \
                && echo "  ✅ $ALARM → remis à OK" \
                || echo "  ⚠️  set-alarm-state non autorisé"
            fi
          done

      # ── Notification email SNS ────────────────────────────────────────
      - name: "Notification SNS — déploiement + SOC réinitialisé"
        run: |
          IP="${{ needs.deploy-ecs.outputs.public_ip }}"
          DEPLOY_TIME="${{ needs.deploy-ecs.outputs.deploy_time }}"
          IMAGE="${{ env.DOCKERHUB_IMAGE }}:${{ github.sha }}"

          aws sns publish \
            --topic-arn "${{ env.SNS_TOPIC_ARN }}" \
            --subject "Deploy OK — ${{ github.repository }} (${{ github.ref_name }})" \
            --message "DEPLOIEMENT REUSSI — SOC REINITIALISE

          Projet    : ${{ github.repository }}
          Branche   : ${{ github.ref_name }}
          Commit    : ${{ github.sha }}
          Acteur    : ${{ github.actor }}
          Heure     : ${DEPLOY_TIME}
          Image     : ${IMAGE}

          Application :
            URL  : http://${IP}:5000
            SOC  : http://${IP}:5000/soc

          SOC Dashboard :
            Metriques ErrorCount         -> 0
            Metriques UnauthorizedAccess -> 0
            Alarmes CloudWatch           -> OK
            Marqueur dans CW Logs        -> injecte

          Le SOC Dashboard affiche maintenant les vraies
          donnees CloudWatch de ce nouveau deploiement." \
            --region ${{ env.AWS_REGION }} \
            && echo "✅ Email SNS envoyé" \
            || echo "⚠️  SNS non autorisé"

      # ── Résumé final ──────────────────────────────────────────────────
      - name: "Résumé final"
        run: |
          IP="${{ needs.deploy-ecs.outputs.public_ip }}"
          echo ""
          echo "╔══════════════════════════════════════════════╗"
          echo "║   PIPELINE COMPLET — SOC RÉINITIALISÉ ✅    ║"
          echo "╠══════════════════════════════════════════════╣"
          echo "║ Commit  : ${{ github.sha }}"
          echo "║ Branche : ${{ github.ref_name }}"
          echo "║ Acteur  : ${{ github.actor }}"
          echo "║ Image   : ${{ env.DOCKERHUB_IMAGE }}:${{ github.sha }}"
          echo "╠══════════════════════════════════════════════╣"
          echo "║ ✅ Job 1 — SAST (Gitleaks+Bandit+Safety+Tests)"
          echo "║ ✅ Job 2 — Build Docker Hub + Trivy + CodeQL"
          echo "║ ✅ Job 3 — DAST OWASP ZAP"
          echo "║ ✅ Job 4 — ECS deploy (register + StopTask)"
          echo "║ ✅ Job 5 — SOC Reset"
          echo "║           Métriques → 0"
          echo "║           Alarmes CW → OK"
          echo "║           Log CW → marqueur injecté"
          echo "║           Email SNS → envoyé"
          echo "╠══════════════════════════════════════════════╣"
          echo "║ SOC : http://${IP}:5000/soc"
          echo "╚══════════════════════════════════════════════╝"