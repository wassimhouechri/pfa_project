name: "DevSecOps CI/CD Pipeline — AWS Academy"

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  AWS_REGION:       us-east-1
  ECR_REGISTRY:     792782834628.dkr.ecr.us-east-1.amazonaws.com
  ECR_REPOSITORY:   devsecops-project
  ECS_CLUSTER:      devsecops-cluster
  ECS_SERVICE:      devsecops-service
  ECS_TASK_FAMILY:  devsecops-task
  CONTAINER_NAME:   devsecops-app

# ============================================================
# JOB 1 — SAST + Tests unitaires
# ============================================================
jobs:
  sast-scan:
    name: "Secrets & Static Analysis"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks — detect secrets in git history
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --source . --verbose --redact --exit-code=0 --no-git

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install all dependencies
        run: |
          pip install -r app/requirements.txt
          pip install bandit safety pytest pytest-cov

      - name: Bandit — static code analysis
        run: |
          bandit -r app/ \
            -f json \
            -o bandit-report.json \
            -ll \
            --exclude app/tests || true
          echo "✅ Bandit scan complete"

      - name: Safety — check CVEs in dependencies
        run: |
          safety check -r app/requirements.txt --json > safety-report.json || true
          echo "✅ Safety scan complete"

      - name: Run unit tests (25 tests)
        run: |
          cd app
          pytest tests/ -v \
            --junitxml=test-results.xml \
            --cov=. \
            --cov-report=xml:coverage.xml \
            --cov-report=term-missing
          echo "✅ All tests passed"

      - name: Upload SAST reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sast-reports
          path: |
            bandit-report.json
            safety-report.json
            app/test-results.xml
            app/coverage.xml
          retention-days: 14

# ============================================================
# JOB 2 — Build Docker + Push vers ECR + Trivy scan
# ============================================================
  build-scan:
    name: "Build & Container Security — ECR"
    runs-on: ubuntu-latest
    needs: sast-scan
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials (Academy temporaires)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token:     ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image (Gunicorn non-root)
        run: |
          docker build \
            -t ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }} \
            -t ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:latest \
            ./app
          echo "✅ Image built"
          docker images | grep devsecops

      - name: Trivy — vulnerability scan (CRITICAL + HIGH only)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref:      "${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}"
          scan-type:      "image"
          format:         "sarif"
          output:         "trivy-results.sarif"
          severity:       "CRITICAL,HIGH"
          exit-code:      "0"
          ignore-unfixed: true

      - name: Upload Trivy SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif

      - name: Push image to ECR
        if: github.event_name == 'push'
        run: |
          docker push ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          docker push ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:latest
          echo "✅ Image pushed:"
          echo "   ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}"

# ============================================================
# JOB 3 — DAST : OWASP ZAP scan (depuis ECR)
# ============================================================
  dast-scan:
    name: "DAST — OWASP ZAP"
    runs-on: ubuntu-latest
    needs: build-scan

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token:     ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Start app container (depuis ECR)
        run: |
          docker run -d \
            --name test-app \
            -p 5000:5000 \
            -e SECRET_KEY="test-secret-zap" \
            -e PORT="5000" \
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          echo "✅ Container started"

      - name: Wait for /health endpoint
        run: |
          echo "Waiting for app to start (max 90s)..."
          for i in {1..30}; do
            if curl -sf http://localhost:5000/health; then
              echo ""
              echo "✅ App is ready at attempt $i"
              break
            fi
            echo "  Attempt $i/30 — retrying in 3s..."
            sleep 3
          done

      - name: OWASP ZAP baseline scan
        run: |
          CONTAINER_IP=$(docker inspect -f \
            '{{range.NetworkSettings.Networks}}{{.IPAddress}}{{end}}' test-app)
          echo "Container IP: $CONTAINER_IP"
          mkdir -p zap-reports

          docker run --rm \
            -v $(pwd)/zap-reports:/zap/wrk/:rw \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
            -t http://$CONTAINER_IP:5000 \
            -J report_json.json \
            -w report_md.md \
            -r report_html.html \
            -I || true

          # Copier les rapports
          for f in report_html.html report_json.json report_md.md; do
            [ -f "zap-reports/$f" ] && cp "zap-reports/$f" . && echo "  Copied: $f"
          done

      - name: Upload ZAP report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-report
          path: |
            report_html.html
            report_json.json
            report_md.md
          retention-days: 14

      - name: Stop test container
        if: always()
        run: docker stop test-app && docker rm test-app

# ============================================================
# JOB 4 — Deploy vers AWS ECS Fargate (remplace KIND/K8s)
# ============================================================
  deploy-aws:
    name: "Deploy — AWS ECS Fargate"
    runs-on: ubuntu-latest
    needs: dast-scan
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token:     ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Télécharge la task def actuelle et injecte le nouveau SHA d'image
      - name: Download current task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition ${{ env.ECS_TASK_FAMILY }} \
            --query taskDefinition \
            --region ${{ env.AWS_REGION }} \
            > task-def.json
          echo "✅ Task definition downloaded"
          cat task-def.json | python3 -c "import json,sys; d=json.load(sys.stdin); print('  Current image:', d['containerDefinitions'][0]['image'])"

      - name: Inject new image SHA into task definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-def.json
          container-name:  ${{ env.CONTAINER_NAME }}
          image:           ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}

      - name: Deploy new task definition to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        with:
          task-definition:          ${{ steps.task-def.outputs.task-definition }}
          service:                  ${{ env.ECS_SERVICE }}
          cluster:                  ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true

      - name: Verify ECS service health
        run: |
          echo "=== ECS Service Status ==="
          aws ecs describe-services \
            --cluster ${{ env.ECS_CLUSTER }} \
            --services ${{ env.ECS_SERVICE }} \
            --query "services[0].{Status:status,Running:runningCount,Desired:desiredCount,Pending:pendingCount}" \
            --output table \
            --region ${{ env.AWS_REGION }}

      - name: Get public IP and run health check
        run: |
          # Récupère l'IP publique de la task ECS
          TASK_ARN=$(aws ecs list-tasks \
            --cluster ${{ env.ECS_CLUSTER }} \
            --service-name ${{ env.ECS_SERVICE }} \
            --query "taskArns[0]" --output text \
            --region ${{ env.AWS_REGION }})

          ENI_ID=$(aws ecs describe-tasks \
            --cluster ${{ env.ECS_CLUSTER }} \
            --tasks $TASK_ARN \
            --query "tasks[0].attachments[0].details[?name=='networkInterfaceId'].value" \
            --output text --region ${{ env.AWS_REGION }})

          PUBLIC_IP=$(aws ec2 describe-network-interfaces \
            --network-interface-ids $ENI_ID \
            --query "NetworkInterfaces[0].Association.PublicIp" \
            --output text --region ${{ env.AWS_REGION }})

          sleep 10

          # Test /health
          HEALTH=$(curl -s -o /dev/null -w "%{http_code}" http://$PUBLIC_IP:5000/health || echo "000")
          if [ "$HEALTH" = "200" ]; then
            echo "✅ /health → HTTP 200"
          else
            echo "⚠️  /health → HTTP $HEALTH (app may still be starting)"
          fi

          # Test /api/status
          API_RESP=$(curl -s http://$PUBLIC_IP:5000/api/status 2>/dev/null || echo "{}")
          if echo "$API_RESP" | grep -q "ok"; then
            echo "✅ /api/status → running"
          else
            echo "⚠️  /api/status → $API_RESP"
          fi

          echo ""
          echo "========================================="
          echo "✅  DEPLOYMENT COMPLETED SUCCESSFULLY"
          echo "========================================="
          echo "  App URL     : http://$PUBLIC_IP:5000"
          echo "  Health      : http://$PUBLIC_IP:5000/health"
          echo "  API status  : http://$PUBLIC_IP:5000/api/status"
          echo "  Dashboard   : http://$PUBLIC_IP:5000/login"
          echo "  ECR Image   : ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}"
          echo "========================================="

      - name: Tail CloudWatch logs
        if: always()
        run: |
          echo "=== Recent CloudWatch Logs ==="
          TASK_ID=$(aws ecs list-tasks \
            --cluster ${{ env.ECS_CLUSTER }} \
            --query "taskArns[0]" --output text \
            --region ${{ env.AWS_REGION }} | awk -F/ '{print $NF}')

          aws logs get-log-events \
            --log-group-name /ecs/devsecops \
            --log-stream-name "ecs/${{ env.CONTAINER_NAME }}/$TASK_ID" \
            --limit 30 \
            --region ${{ env.AWS_REGION }} \
            --query "events[*].message" \
            --output text 2>/dev/null || echo "(logs not yet available)"