name: "DevSecOps CI/CD Pipeline"

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  IMAGE_NAME: wassimoz/devsecops-project

jobs:
  sast-scan:
    name: "Secrets & Static Analysis"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks — detect secrets in git history
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --source . --verbose --redact --exit-code=0 --no-git  

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install security tools
        run: pip install bandit safety pytest

      - name: Bandit — static code analysis
        run: |
          bandit -r app/ \
            -f json \
            -o bandit-report.json \
            -ll \
            --exclude app/tests
          echo "Bandit scan complete"

      - name: Safety CLI — check known CVEs in dependencies
        run: |
          safety check -r app/requirements.txt --json > safety-report.json || true
          echo "Safety scan complete"

      - name: Install dependencies
        run: |
          pip install -r app/requirements.txt
          pip install pytest pytest-cov

      - name: Run unit tests
        run: |
          cd app
          pytest tests/ -v --junitxml=test-results.xml
          echo "Tests completed"

      - name: Upload SAST reports as artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sast-reports
          path: |
            bandit-report.json
            safety-report.json
            app/test-results.xml
          retention-days: 14

  build-scan:
    name: "Build & Container Security"
    runs-on: ubuntu-latest
    needs: sast-scan
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.REPO_USER }}
          password: ${{ secrets.PWD }}

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ env.IMAGE_NAME }}:${{ github.sha }} \
            -t ${{ env.IMAGE_NAME }}:latest \
            ./app

      - name: Trivy — scan container for vulnerabilities
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "${{ env.IMAGE_NAME }}:${{ github.sha }}"
          scan-type: "image"
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "CRITICAL,HIGH"
          exit-code: "0"
          ignore-unfixed: true

      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif

      - name: Push image to Docker Hub
        if: github.event_name == 'push'
        run: |
          docker push ${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker push ${{ env.IMAGE_NAME }}:latest

  dast-scan:
    name: "DAST — OWASP ZAP"
    runs-on: ubuntu-latest
    needs: build-scan

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.REPO_USER }}
          password: ${{ secrets.PWD }}

      - name: Start application container
        run: |
          docker run -d \
            --name test-app \
            -p 5000:5000 \
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Wait for app to be healthy
        run: |
          echo "Waiting for app to start..."
          for i in {1..30}; do
            if curl -sf http://localhost:5000/health; then
              echo "App is ready"
              break
            fi
            echo "Attempt $i failed, retrying in 3s..."
            sleep 3
          done

      - name: Get container IP and run ZAP
        run: |
          CONTAINER_IP=$(docker inspect -f '{{range.NetworkSettings.Networks}}{{.IPAddress}}{{end}}' test-app)
          echo "Container IP: $CONTAINER_IP"
          
          docker run --rm \
            -v $(pwd):/zap/wrk/:rw \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
            -t http://$CONTAINER_IP:5000 \
            -J report_json.json \
            -w report_md.md \
            -r report_html.html \
            -I || true

      - name: Upload ZAP report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-report
          path: |
            report_html.html
            report_json.json
            report_md.md
          retention-days: 14

      - name: Stop and remove test container
        if: always()
        run: docker stop test-app && docker rm test-app

  deploy-k8s:
    name: "Deploy — Kubernetes Production"
    runs-on: ubuntu-latest
    needs: dast-scan
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install KIND
        run: |
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/v0.20.0/kind-linux-amd64
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind

      - name: Install kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.REPO_USER }}
          password: ${{ secrets.PWD }}

      - name: Pull Docker image
        run: |
          docker pull ${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker tag ${{ env.IMAGE_NAME }}:${{ github.sha }} ${{ env.IMAGE_NAME }}:prod

      - name: Create Production Cluster
        run: |
          cat <<EOF | kind create cluster --name=devsecops-prod --config=-
          kind: Cluster
          apiVersion: kind.x-k8s.io/v1alpha4
          nodes:
          - role: control-plane
          - role: worker
          - role: worker
          - role: worker
          networking:
            podSubnet: "10.244.0.0/16"
            serviceSubnet: "10.96.0.0/12"
          EOF

      - name: Load Images
        run: |
          kind load docker-image ${{ env.IMAGE_NAME }}:${{ github.sha }} --name devsecops-prod
          kind load docker-image ${{ env.IMAGE_NAME }}:prod --name devsecops-prod

      - name: Deploy Infrastructure
        run: |
          # Namespace
          kubectl create namespace devsecops --dry-run=client -o yaml | kubectl apply -f -
          
          # ConfigMap
          kubectl apply -f k8s/configmap.yml
          
          # Secret
          kubectl apply -f k8s/secret.yml
          
          # Deployment
          envsubst < k8s/deployment.yml | kubectl apply -f -
          
          # Service
          kubectl apply -f k8s/service.yml
          
          # HPA
          kubectl apply -f k8s/hpa.yml
          
          # Network Policy
          kubectl apply -f k8s/networkpolicy.yml

      - name: Wait for Ready
        run: |
          kubectl wait --for=condition=available --timeout=300s deployment/devsecops-app -n devsecops
          kubectl wait --for=condition=ready --timeout=300s pods --all -n devsecops

      - name: Verify Deployment
        run: |
          echo "=== Status ==="
          kubectl get all -n devsecops
          kubectl get hpa -n devsecops
          kubectl get networkpolicies -n devsecops
          
          echo "=== Pods Details ==="
          kubectl top pods -n devsecops || echo "Metrics not available"
          
          echo "=== Service Endpoints ==="
          kubectl get endpoints -n devsecops

      - name: Integration Test
        run: |
          kubectl port-forward -n devsecops service/devsecops-app-service 5000:80 &
          sleep 15
          
          echo "=== Testing Application ==="
          curl -f http://localhost:5000/health || exit 1
          curl -f http://localhost:5000/api/status || exit 1
          
          echo "=== Performance Test ==="
          ab -n 100 -c 10 http://localhost:5000/health || echo "ab not installed"
          
          echo "✅ Production Deployment Successful!"

      - name: Collect Artifacts
        if: always()
        run: |
          mkdir -p k8s-artifacts
          kubectl describe pods -n devsecops > k8s-artifacts/pods-describe.txt
          kubectl logs -n devsecops --all-containers --prefix --tail=100 > k8s-artifacts/logs.txt
          kubectl get all -n devsecops -o yaml > k8s-artifacts/all-resources.yaml

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: k8s-deployment-artifacts
          path: k8s-artifacts/
          retention-days: 14