name: "DevSecOps CI/CD Pipeline/3"

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  IMAGE_NAME: wassimoz/devsecops-project

jobs:
  sast-scan:
    name: "Secrets & Static Analysis"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks — detect secrets in git history
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --source . --verbose --redact --exit-code=0 --no-git  

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install security tools
        run: pip install bandit safety pytest

      - name: Bandit — static code analysis
        run: |
          bandit -r app/ \
            -f json \
            -o bandit-report.json \
            -ll \
            --exclude app/tests
          echo "Bandit scan complete"

      - name: Safety CLI — check known CVEs in dependencies
        run: |
          safety check -r app/requirements.txt --json > safety-report.json || true
          echo "Safety scan complete"

      - name: Install dependencies
        run: |
          pip install -r app/requirements.txt
          pip install pytest pytest-cov

      - name: Run unit tests
        run: |
          cd app
          pytest tests/ -v --junitxml=test-results.xml
          echo "Tests completed"

      - name: Upload SAST reports as artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sast-reports
          path: |
            bandit-report.json
            safety-report.json
            app/test-results.xml
          retention-days: 14

  build-scan:
    name: "Build & Container Security"
    runs-on: ubuntu-latest
    needs: sast-scan
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.REPO_USER }}
          password: ${{ secrets.PWD }}

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ env.IMAGE_NAME }}:${{ github.sha }} \
            -t ${{ env.IMAGE_NAME }}:latest \
            ./app

      - name: Trivy — scan container for vulnerabilities
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "${{ env.IMAGE_NAME }}:${{ github.sha }}"
          scan-type: "image"
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "CRITICAL,HIGH"
          exit-code: "0"  # Mis à 0 pour ne pas bloquer pendant les tests
          ignore-unfixed: true

      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif

      - name: Push image to Docker Hub
        if: github.event_name == 'push'
        run: |
          docker push ${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker push ${{ env.IMAGE_NAME }}:latest

  dast-scan:
    name: "DAST — OWASP ZAP"
    runs-on: ubuntu-latest
    needs: build-scan

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.REPO_USER }}
          password: ${{ secrets.PWD }}

      - name: Start application container
        run: |
          docker run -d \
            --name test-app \
            -p 5000:5000 \
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Wait for app to be healthy
        run: |
          echo "Waiting for app to start..."
          for i in {1..30}; do
            if curl -sf http://localhost:5000/health; then
              echo "App is ready"
              break
            fi
            echo "Attempt $i failed, retrying in 3s..."
            sleep 3
          done
      - name: Get container IP and run ZAP
        run: |
          # Récupérer l'IP du conteneur
          CONTAINER_IP=$(docker inspect -f '{{range.NetworkSettings.Networks}}{{.IPAddress}}{{end}}' test-app)
          echo "Container IP: $CONTAINER_IP"
          
          # Lancer ZAP directement avec docker run
          docker run --rm \
            -v $(pwd):/zap/wrk/:rw \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
            -t http://$CONTAINER_IP:5000 \
            -J report_json.json \
            -w report_md.md \
            -r report_html.html \
            -I || true

      - name: Upload ZAP report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-report
          path: |
            report_html.html
            report_json.json
            report_md.md
          retention-days: 14

      - name: Stop and remove test container
        if: always()
        run: docker stop test-app && docker rm test-app

  deploy-k8s:
    name: "Deploy — AWS EKS"
    runs-on: ubuntu-latest
    needs: dast-scan
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials with session token
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Install eksctl
        run: |
          curl --silent --location "https://github.com/weaveworks/eksctl/releases/latest/download/eksctl_$(uname -s)_amd64.tar.gz" | tar xz -C /tmp
          sudo mv /tmp/eksctl /usr/local/bin
          eksctl version

      - name: Check AWS identity
        run: |
          aws sts get-caller-identity
          aws eks list-clusters --region ${{ secrets.AWS_REGION }} || echo "No clusters yet"

      - name: Create EKS cluster (if not exists)
        run: |
          if ! aws eks describe-cluster --name devsecops-cluster --region ${{ secrets.AWS_REGION }} 2>/dev/null; then
            echo "Creating EKS cluster (this takes 15-20 minutes)..."
            eksctl create cluster \
              --name devsecops-cluster \
              --region ${{ secrets.AWS_REGION }} \
              --nodegroup-name devsecops-nodes \
              --node-type t3.medium \
              --nodes 2 \
              --nodes-min 1 \
              --nodes-max 3 \
              --managed \
              --timeout=20m
          else
            echo "Cluster already exists"
          fi

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig --region ${{ secrets.AWS_REGION }} --name devsecops-cluster

      - name: Verify cluster access
        run: |
          kubectl cluster-info
          kubectl get nodes

      - name: Apply Kubernetes manifests
        run: |
          # Créer le namespace
          kubectl apply -f k8s/namespace.yml
          
          # Appliquer les secrets
          kubectl apply -f k8s/secret.yml
          
          # Déployer l'application
          kubectl apply -f k8s/deployment.yml
          kubectl apply -f k8s/service.yml
          kubectl apply -f k8s/ingress.yml || echo "Ingress skipped"

      - name: Update image to latest
        run: |
          kubectl set image deployment/devsecops-app \
            devsecops-app=${{ env.IMAGE_NAME }}:${{ github.sha }} \
            -n devsecops

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/devsecops-app -n devsecops --timeout=300s

      - name: Get deployment status
        run: |
          echo "=== Pods ==="
          kubectl get pods -n devsecops
          echo "=== Services ==="
          kubectl get svc -n devsecops
          echo "=== Ingress ==="
          kubectl get ingress -n devsecops
          
          # Pour le LoadBalancer
          if kubectl get svc devsecops-app-service -n devsecops 2>/dev/null; then
            echo "Waiting for LoadBalancer IP..."
            sleep 30
            kubectl get svc devsecops-app-service -n devsecops
          fi