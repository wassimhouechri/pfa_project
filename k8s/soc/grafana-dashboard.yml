apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-soc
  namespace: soc
  labels:
    grafana_dashboard: "1"

data:
  soc-dashboard.json: |
    {
      "title": "SOC Dashboard",
      "timezone": "browser",
      "schemaVersion": 16,
      "version": 1,
      "panels": [
        {
          "title": "Falco Alerts",
          "type": "timeseries",
          "targets": [
            {
              "expr": "rate(falcosidekick_events_total[1m])"
            }
          ]
        },
        {
          "title": "Running Pods",
          "type": "stat",
          "targets": [
            {
              "expr": "sum(kube_pod_status_phase{phase=\"Running\"})"
            }
          ]
        }
      ]
    }