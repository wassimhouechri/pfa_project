apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: soc
data:
  soc-dashboard.json: |
    {
      "title": "SOC - Security Dashboard",
      "panels": [
        {
          "title": "Container Security Events",
          "type": "graph",
          "targets": [
            {
              "expr": "falco_events_total",
              "legendFormat": "Security Events"
            }
          ]
        },
        {
          "title": "Pod Status",
          "type": "stat",
          "targets": [
            {
              "expr": "sum(kube_pod_status_phase{phase='Running'})"
            }
          ]
        }
      ]
    }