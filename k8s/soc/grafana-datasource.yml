apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: soc
  labels:
    grafana_datasource: "1"

data:
  datasource.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://monitoring-kube-prometheus-prometheus:9090
        isDefault: true